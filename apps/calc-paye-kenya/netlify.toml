# Static prerender — no Nitro / no Netlify function adapter.
# Netlify runs this config with cwd = repo root (packagePath is only metadata),
# so publish must be the path from the repo root, not from this folder.
[build]
  command = "pnpm --filter calc-paye-kenya build"
  publish = "apps/calc-paye-kenya/dist/client"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
